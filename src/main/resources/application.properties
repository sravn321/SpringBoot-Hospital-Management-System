spring.application.name=Hospital-Management-System


# MySQL Database & JPA Properties
spring.datasource.url=jdbc:mysql://localhost:3306/hospitaldb
spring.datasource.username=root
spring.datasource.password=hello123@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Boot Actuator Properties

# Expose specific endpoints (use '*' to expose all)
management.endpoints.web.exposure.include=health,info,metrics

# Show detailed health info (displays MySQL connection status & validation query)
management.endpoint.health.show-details=always

# Enable database health indicator explicitly (enabled by default)
management.health.db.enabled=true